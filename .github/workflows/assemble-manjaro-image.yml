          def archive_tree(source, destination, level):
              """Stream native GNU tar into xz; no raw tar file or target program execution."""
              require(not destination.exists(),'Archive destination already exists')
              raw_hash=hashlib.sha256(); raw_size=0; processes=[]
              env={**os.environ,'LC_ALL':'C','TZ':'UTC'}
              try:
                  with tempfile.TemporaryFile() as tar_errors, tempfile.TemporaryFile() as xz_errors, destination.open('xb') as output:
                      tar=subprocess.Popen(['tar','--numeric-owner','--acls','--xattrs','--xattrs-include=*','--sort=name',
                          '--one-file-system','--sparse','--format=posix','--blocking-factor=20',
                          '--pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime',
                          '-c','-f','-','-C',str(source),'.'],stdout=subprocess.PIPE,stderr=tar_errors,env=env)
                      processes.append(tar)
                      xz=subprocess.Popen(['xz','--threads=2','--block-size=16MiB','--check=crc64','-'+str(level),'-c'],
                          stdin=subprocess.PIPE,stdout=output,stderr=xz_errors,env=env)
                      processes.append(xz)
                      while block:=tar.stdout.read(1024**2):
                          xz.stdin.write(block); raw_hash.update(block); raw_size+=len(block)
                          if os.fstat(output.fileno()).st_size > MAX_ASSET: raise ArchiveTooLarge()
                      tar.stdout.close(); xz.stdin.close()
                      require(tar.wait(timeout=60)==0 and xz.wait(timeout=120)==0,'Native tar/xz failed')
                      output.flush(); os.fsync(output.fileno())
                  if destination.stat().st_size > MAX_ASSET: raise ArchiveTooLarge()
                  count=0; checked=hashlib.sha256()
                  with lzma.open(destination,'rb') as decoded:
                      while block:=decoded.read(1024**2): count+=len(block); checked.update(block)
                  require(count==raw_size and checked.digest()==raw_hash.digest(),'Archive decompression verification failed')
                  return dict(name=destination.name,size=destination.stat().st_size,sha256=sha_file(destination),
                              tar_size=raw_size,tar_sha256=raw_hash.hexdigest(),xz_level=level)
              except Exception:
                  for process in processes:
                      if process.poll() is None: process.terminate()
                  for process in processes:
                      try: process.wait(timeout=10)
                      except subprocess.TimeoutExpired: process.kill(); process.wait()
                  destination.unlink(missing_ok=True)
                  raise
          
          
