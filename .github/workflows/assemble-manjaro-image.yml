                  command(['sudo','-n','fsck.vfat','-n',loop+'p1'],timeout=120)
                  command(['sudo','-n','e2fsck','-f','-n',loop+'p2'],timeout=300)
                  for index,kind,path in [(1,'vfat',paths[0]),(2,'ext4',paths[1])]:
