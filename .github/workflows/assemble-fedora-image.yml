          def verify_remote_asset(api, asset, name, size, checksum, directory):
              check_asset_metadata(asset,name,size,checksum)
              if asset.get('digest') == 'sha256:' + checksum:
                  return
              # GitHub permits a null digest. Verify actual bytes before idempotent reuse.
              temporary = directory / ('remote-verification-' + str(asset['id']))
