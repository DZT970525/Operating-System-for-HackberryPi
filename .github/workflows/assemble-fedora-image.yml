              return path
          
          
          def image_link(root, source):
              """Resolve only image-local unit links, including absolute target links."""
              seen=set(); current=source
              for _ in range(24):
                  require(current.is_relative_to(root), 'Unit link escapes the mounted image')
                  if not current.is_symlink(): return current
                  require(current not in seen, 'Unit symlink loop')
                  seen.add(current); target=current.readlink()
                  current = root / str(target).lstrip('/') if target.is_absolute() else Path(os.path.normpath(current.parent / target))
              raise RuntimeError('Unit symlink chain exceeds the image-local limit')
          
          
