          def resolve_release(api, spec):
              releases = api.get(f'repos/{REPOSITORY}/releases?per_page=100',pages=True)
              matching = [release for release in releases if release.get('tag_name') == spec['tag']]
              require(len(matching) == 1,'Release tag must match exactly one release, including drafts')
