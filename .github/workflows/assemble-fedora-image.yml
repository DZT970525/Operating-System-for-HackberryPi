              slot = efi / 'hackberrypi' / slot_name
              manifest = json.loads(safe_file(slot,'manifest.json').read_text())
              require(manifest.get('kernel')==profile.get('last_kernel') and manifest.get('slot')==slot_name,
                      'Active firmware manifest identity differs')
              require(isinstance(manifest.get('files'),dict) and 10 <= len(manifest['files']) <= 2000, 'Invalid firmware file set')
              require(all(name in manifest['files'] for name in [
                  'kernel_2712.img','initramfs_2712','cmdline.txt','overlays/README',
                  'overlays/overlay_map.dtb','overlays/hackberrypicm5.dtbo',
                  'bcm2712-rpi-cm5l-cm4io.dtb','bcm2712-rpi-cm5l-cm5io.dtb']),
                  'Required kernel/initramfs/CM5 DTB or overlay member is missing')
              for relative,record in manifest['files'].items():
                  exact_keys(record,['sha256','bytes'],'firmware member')
                  digest(record['sha256']); positive(record['bytes'])
                  path = safe_file(slot,relative)
                  require(path.stat().st_size==record['bytes'] and sha_file(path)==record['sha256'], 'Active firmware member differs')
              cmdline = safe_file(slot,'cmdline.txt').read_text().split()
              require(cmdline.count('root=UUID='+uuids['root'])==1 and sum(x.startswith('root=') for x in cmdline)==1 and
                      'consoleblank=0' in cmdline and
                      not any(x in ('selinux=0','enforcing=0') or x.startswith(('init=','rdinit=')) for x in cmdline),
                      'Active firmware root or security command line differs')
              return dict(fedora=True,canonical_fstab_matches_actual_uuids=True,stale_native_mounts_absent=True,
                          selinux_enforcing=True,default_scale=900,first_boot_growth_layout_verified=True,
                          active_firmware_files_sha256_verified=len(manifest['files']))
          
          
          @contextlib.contextmanager
          def read_only_image(raw, directory, layout):
              loop = command(['sudo','-n','losetup','--find','--show','--read-only','--partscan',str(raw)])
              mounted=[]; paths={name:directory/(name+'-ro') for name in ('efi','boot','root')}
              uuids={}
              try:
                  loop_identity(loop,raw)
                  command(['sudo','-n','udevadm','settle','--timeout=10'],timeout=15)
                  for index,name,kind,label in [(1,'efi','vfat','FEDORA_EFI'),(2,'boot','ext4','FEDORA_BOOT'),(3,'root','ext4','FEDORA_ROOT')]:
                      source=loop+'p'+str(index)
                      require(command(['sudo','-n','blockdev','--getro',source]) == '1', 'Partition is not read-only')
                      require(command(['sudo','-n','blkid','-p','-s','TYPE','-o','value',source])==kind and
                              command(['sudo','-n','blkid','-p','-s','LABEL','-o','value',source])==label, 'Unexpected filesystem label/type')
                      uuids[name]=command(['sudo','-n','blkid','-p','-s','UUID','-o','value',source])
                      command(['sudo','-n','fsck.vfat','-n',source] if kind=='vfat' else
                              ['sudo','-n','e2fsck','-f','-n',source],timeout=300)
                  for index,name,kind in [(1,'efi','vfat'),(2,'boot','ext4'),(3,'root','ext4')]:
                      path=paths[name]; path.mkdir(); options='ro,noexec,nodev,nosuid'+(',noload' if kind=='ext4' else '')
                      source=loop+'p'+str(index)
                      command(['sudo','-n','mount','-t',kind,'-o',options,source,str(path)])
                      mounted.append(path); checked_mount(source,path,kind)
                  yield inspect_native_filesystems(paths,uuids,layout)
              finally:
                  errors=[]
                  for path in reversed(mounted):
                      try: command(['sudo','-n','umount',str(path)])
                      except Exception as error: errors.append(error)
                  if not errors:
                      loop_identity(loop,raw)
                      command(['sudo','-n','losetup','--detach',loop])
                  require(not errors, 'Image mount could not be released; exact loop left untouched for inspection')
          
          
          def upload_url(target, name):
              base=target.get('upload_url','').split('{',1)[0]
              parsed=urllib.parse.urlsplit(base)
              require(parsed.scheme=='https' and parsed.netloc=='uploads.github.com' and
                      parsed.path==f'/repos/{REPOSITORY}/releases/{target["id"]}/assets' and
                      not parsed.query and not parsed.fragment,'Unexpected target upload endpoint')
              return base+'?name='+urllib.parse.quote(name,safe='')
          
          
          def upload_verified(api,frozen,pair,path,directory,sleep=time.sleep):
              allowed={frozen['image']['name'],MANIFEST_NAME}
              require(path.name in allowed and path.is_file() and not path.is_symlink() and
                      path.parent.resolve()==directory.resolve(),'Output is outside filename/path whitelist')
              size=path.stat().st_size; checksum=sha_file(path); positive(size,MAX_ASSET)
              parts={part['name'] for part in frozen['parts']}
              current=resolve_pair(api,frozen,pair); existing=target_asset(api,current[1],path.name,parts)
              if existing is not None:
                  verify_remote_asset(api,existing,path.name,size,checksum,directory); return
              # No POST retry unless a fresh read proves the name is still absent.
              for attempt in range(3):
                  current=resolve_pair(api,frozen,pair)
                  existing=target_asset(api,current[1],path.name,parts)
                  if existing is not None:
                      verify_remote_asset(api,existing,path.name,size,checksum,directory); return
                  try: outcome=api.upload(upload_url(current[1],path.name),path)
                  except (OSError,subprocess.SubprocessError): outcome=dict(status=None,retry_after=0)
                  retry_after=outcome.get('retry_after',0)
                  require(type(retry_after) is int and 0 <= retry_after <= 600,
                          'API retry window exceeds this manual job; drafts/assets left untouched')
                  if retry_after: sleep(retry_after)
                  # A lost HTTP response may hide a completed upload: never clobber.
                  for poll in range(6):
                      current=resolve_pair(api,frozen,pair)
                      observed=target_asset(api,current[1],path.name,parts)
                      if observed is not None:
                          verify_remote_asset(api,observed,path.name,size,checksum,directory); return
                      if poll<5: sleep(2)
                  require(attempt<2,'Asset upload failed; all drafts/assets left unchanged except completed uploads')
                  require(outcome.get('status') not in (400,401,403,404,409,422) or
                          (outcome.get('status')==403 and retry_after>0),
                          'Upload was rejected; no automatic deletion/replacement/retry of a rejected asset')
                  sleep(3*(attempt+1))
          
          
          def run_assembly(frozen, api=None):
              validate_manifest(frozen)
              require(os.environ.get('GITHUB_REPOSITORY')==REPOSITORY and
                      os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch' and
                      os.environ.get('GITHUB_REF')=='refs/heads/main', 'Only manual execution in the intended main repository is allowed')
              require(os.geteuid()==0, 'Run inside the workflow private mount namespace')
              require(os.readlink('/proc/self/ns/mnt') != os.readlink('/proc/1/ns/mnt'), 'Private mount namespace is required')
              api=api or GitHub(); pair=resolve_pair(api,frozen)
              listed=source_assets(api,pair[0],frozen['parts'])
              directory=Path(tempfile.mkdtemp(prefix='fedora-verified-assembly-',dir=os.environ.get('RUNNER_TEMP')))
              directory.chmod(0o700)
              image=frozen['image']; compressed=directory/image['name']; raw=directory/image['name'][:-3]
              required=image['raw_size']+image['size']+MAX_ASSET+512*1024**2
              require(shutil.disk_usage(directory).free>=required, 'Runner lacks safe free space for image and existing-asset verification')
              size,checksum=assemble_parts(api,frozen['parts'],listed,compressed,directory)
              require(size==image['size'] and checksum==image['sha256'], 'Assembled compressed image differs')
              decompress_verified(compressed,raw,image['raw_size'],image['raw_sha256'])
              inspect_mbr(raw,frozen['layout'])
              with read_only_image(raw,directory,frozen['layout']) as validations:
                  require(validations['fedora'] is True, 'Fedora filesystem inspection did not pass')
              require(raw.stat().st_size==image['raw_size'] and sha_file(raw)==image['raw_sha256'],
                      'Read-only inspection changed raw image bytes; nothing uploaded')
              require(compressed.stat().st_size==image['size'] and sha_file(compressed)==image['sha256'],
                      'Compressed image changed before upload')
              raw.unlink()  # Only this verified temporary raw copy, after its loop was detached.
              manifest=dict(schema_version=1,repository=REPOSITORY,source_tag=frozen['source']['tag'],target_tag=frozen['target']['tag'],
                  frozen_manifest_sha256=canonical_sha(frozen),image=image,layout=frozen['layout'],
                  validations=validations,raw_image_unchanged_after_read_only_inspection=True,
                  target_arm_code_executed=False,release_drafts_published_or_deleted=False)
              small=directory/MANIFEST_NAME
              small.write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
              require(small.stat().st_size<128*1024, 'Output metadata is unexpectedly large')
              for path in [compressed,small]:
                  upload_verified(api,frozen,pair,path,directory)
              resolve_pair(api,frozen,pair)
              print('FEDORA_ASSEMBLY_MANIFEST_BEGIN',flush=True)
              print(json.dumps(manifest,sort_keys=True,separators=(',',':')),flush=True)
              print('FEDORA_ASSEMBLY_MANIFEST_END',flush=True)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
                      output.write('Verified Fedora complete image attached. Both releases remain drafts.\n\n```json\n')
                      output.write(json.dumps(manifest,indent=2)); output.write('\n```\n')
              shutil.rmtree(directory)  # All mounts released; only this generated temporary tree.
              return manifest
          
          
          if __name__ == '__main__':
              require(FROZEN is not None,'Generate this runner from a measured frozen manifest first')
              run_assembly(FROZEN)
          PY
