                      '-H','Content-Length: '+str(path.stat().st_size),'-H','X-GitHub-Api-Version: 2022-11-28',
                      '--input',str(path)],capture_output=True,timeout=900)
                  return upload_outcome(response.stdout,response.returncode)
          
          
          def upload_outcome(output, returncode):
              header=re.split(rb'\r?\n\r?\n',output,maxsplit=1)[0].decode('latin-1')
              first=header.splitlines()[0] if header else ''
              match=re.match(r'HTTP/\S+\s+(\d+)',first)
              status=int(match[1]) if match else None
              fields={line.split(':',1)[0].lower():line.split(':',1)[1].strip()
                      for line in header.splitlines()[1:] if ':' in line}
              wait=0; retry=fields.get('retry-after','')
              if retry.isdigit(): wait=int(retry)
              elif retry:
                  try: wait=max(0,int(email.utils.parsedate_to_datetime(retry).timestamp()-time.time()+1))
                  except (TypeError,ValueError,OverflowError): pass
              if fields.get('x-ratelimit-remaining')=='0' and fields.get('x-ratelimit-reset','').isdigit():
                  wait=max(wait,max(0,int(fields['x-ratelimit-reset'])-int(time.time())+1))
              return dict(ok=returncode==0,status=status,retry_after=wait)
          
          
