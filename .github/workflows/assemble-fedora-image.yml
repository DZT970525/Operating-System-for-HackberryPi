          def checked_mount(source, path, fstype):
              data = json.loads(command(['findmnt','--json','--mountpoint',str(path)]))['filesystems']
              require(len(data)==1 and data[0]['source']==source and data[0]['fstype']==fstype,'Unexpected mounted filesystem')
              options = set(data[0]['options'].split(','))
              require({'ro','nodev','nosuid','noexec'} <= options,'Mount is not strictly read-only/noexec')
              if fstype == 'ext4': require(bool({'noload','norecovery'} & options),'Ext4 journal replay is not disabled')
          
          
          def safe_file(base, relative):
              relative = Path(relative)
              require(not relative.is_absolute() and '..' not in relative.parts, 'Unsafe image-relative path')
              path = base / relative
              require(path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(base.resolve()),
