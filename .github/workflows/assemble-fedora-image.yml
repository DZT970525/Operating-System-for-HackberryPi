          def resolve_pair(api, frozen, expected=None):
              source = resolve_release(api,frozen['source']); target = resolve_release(api,frozen['target'])
              require(source['id'] != target['id'],'Source and target must be different drafts')
              pair = source,target
              if expected is not None:
