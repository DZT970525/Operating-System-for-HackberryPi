              fstab = [line.split('#',1)[0].split() for line in safe_file(root,'etc/fstab').read_text().splitlines()]
              for destination,name,kind in [('/','root','ext4'),('/boot','boot','ext4'),('/boot/efi','efi','vfat')]:
