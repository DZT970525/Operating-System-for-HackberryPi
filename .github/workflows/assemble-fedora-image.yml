                  require(temporary.stat().st_size == size and sha_file(temporary) == checksum,'Existing asset bytes differ')
              finally:
                  temporary.unlink(missing_ok=True)
          
          
          def assemble_parts(api, parts, listed, destination, directory, sleep=time.sleep):
              require(not destination.exists(),'Assembly destination already exists')
              combined = hashlib.sha256(); count = 0
              with destination.open('xb') as output:
                  for part in parts:
                      path = directory / part['name']
                      for attempt in range(3):
                          try:
                              require(not path.exists(),'Transfer temporary already exists')
                              api.download(listed[part['name']]['id'],path)
                              require(path.stat().st_size == part['size'] and sha_file(path) == part['sha256'],'Part bytes differ')
                              break
                          except Exception:
                              path.unlink(missing_ok=True)
                              if attempt == 2: raise
                              sleep(3*(attempt+1))
                      with path.open('rb') as source:
                          while block := source.read(1024**2):
                              output.write(block); combined.update(block); count += len(block)
                      path.unlink()  # Only this verified local temporary; remote draft remains intact.
                  output.flush(); os.fsync(output.fileno())
              return count,combined.hexdigest()
          
          
          def decompress_verified(compressed, destination, size, checksum):
              require(not destination.exists(),'Raw image already exists')
              result = hashlib.sha256(); count = 0
              with lzma.open(compressed,'rb') as source, destination.open('xb') as output:
                  while block := source.read(1024**2):
                      count += len(block); require(count <= size,'Raw stream exceeds frozen byte count')
                      output.write(block); result.update(block)
                  output.flush(); os.fsync(output.fileno())
              require(count == size and result.hexdigest() == checksum,'Raw image bytes/SHA256 differ')
              destination.chmod(0o444)
          
          
          def inspect_mbr(raw, layout):
              with raw.open('rb') as stream: header = stream.read(512)
              require(len(header)==512 and header[510:]==b'\x55\xaa','Invalid image MBR')
              require(f'{int.from_bytes(header[440:444],"little"):08x}' == layout['disk_id'],'Image disk ID differs')
              for index,prefix,kind in [(0,'efi',0x0c),(1,'boot',0x83),(2,'root',0x83)]:
                  entry = header[446+16*index:462+16*index]
                  require(entry[0] == (0x80 if index==0 else 0) and entry[4] == kind and
                          int.from_bytes(entry[8:12],'little') == layout[prefix+'_start'] and
                          int.from_bytes(entry[12:16],'little') == layout[prefix+'_sectors'],'Image partition layout differs')
              require(header[494:510] == bytes(16),'Unexpected fourth partition refused')
          
          
