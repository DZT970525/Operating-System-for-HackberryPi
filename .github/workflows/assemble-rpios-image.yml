# Fixed, manual recovery of one existing private RPiOS release draft.
# Reuses this existing workflow's contents:write permission; never publishes.
name: Recover verified RPiOS v2 draft upload once

"on":
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: rpios-upload-recover-448817824
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'DZT970525/Operating-System-for-HackberryPi' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HBPI_RECOVERY_HELPER_SHA256: '1ba3b24f7e460bf03bc638d9008bc4ec4e9e1f9e571431951566e359591567f4'
      HBPI_RECOVERY_MANIFEST_SHA256: 'dd01f511b5ad5d62caa17ee807cc2dc6518d8c69f98d164be4e1e58ad82091cc'
      HBPI_RECOVERY_MANIFEST_BYTES: '13276'
    steps:
      - name: Check out the exact reviewed manual-run commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned helper and recover only the fixed private draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/rpios_upload_recover_20261117_v2.py
          test ! -L tools/rpios_upload_recover_20261117_v2.py
          printf '%s  %s\n' "$HBPI_RECOVERY_HELPER_SHA256" tools/rpios_upload_recover_20261117_v2.py | sha256sum --check --strict
          test "$HBPI_RECOVERY_MANIFEST_SHA256" = 'dd01f511b5ad5d62caa17ee807cc2dc6518d8c69f98d164be4e1e58ad82091cc'
          test "$HBPI_RECOVERY_MANIFEST_BYTES" = '13276'
          python3 -B tools/rpios_upload_recover_20261117_v2.py
